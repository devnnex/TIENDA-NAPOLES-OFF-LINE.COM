<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f05a28" id="pwaThemeColor">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Servicio a la mesa</title>
    <link rel="manifest" href="manifest.webmanifest" id="appManifest" type="application/manifest+json">
    <link rel="icon" href="pwa-icon.svg" id="appFavicon" type="image/svg+xml">
    <link rel="apple-touch-icon" href="pwa-icon.svg" id="appleTouchIcon">
    <link rel="stylesheet" href="style.css?v=20260920-offline-shared-refresh-zones-1">
    <script src="vendor/supabase-js.min.js"></script>
  </head>
  <body data-page="client">
    <main class="client-app">
      <section class="client-hero">
        <nav class="topbar">
          <div class="brand-lockup">
            <span class="js-brand-logo"></span>
            <div>
              <strong class="js-business-name">Restaurante</strong>
              <span class="js-business-subtitle">Servicio a la mesa</span>
            </div>
          </div>
          <a class="admin-link" href="admin.html" aria-label="Administrador">
            <i data-lucide="shield-check"></i>
          </a>
        </nav>

        <div class="hero-copy">
          <span class="eyebrow">Mesa conectada</span>
          <h1 class="js-business-name">Tu restaurante</h1>
          <p>Ordena, pide tu cuenta o llama al mesero desde tu mesa.</p>
        </div>
      </section>

      <section class="client-panel sticky-actions" id="tablePicker"></section>

      <section class="quick-actions" aria-label="Solicitudes">
        <button class="request-btn" type="button" data-request="waiter">
          <i data-lucide="bell-ring"></i>
          <span>Mesero</span>
        </button>
        <button class="request-btn" type="button" data-request="bill">
          <i data-lucide="receipt-text"></i>
          <span>Ver cuenta</span>
        </button>
        <button class="request-btn" id="songModeToggle" type="button" data-song-request>
          <i data-lucide="music-2"></i>
          <span>Pedir canción</span>
        </button>
      </section>

      <section class="client-section">
        <div class="assistant-panel">
          <div class="assistant-head">
          <div>
            <span class="eyebrow" id="assistantEyebrow">Agente de bar</span>
              <h2 id="assistantTitle"><span class="assistant-live-dot" aria-hidden="true"></span>Pide por chat</h2>
            </div>
            <span class="assistant-mode-icon" id="assistantModeIcon"><i data-lucide="bot"></i></span>
          </div>
          <div class="assistant-chat" id="assistantChat"></div>
          <div class="typing-indicator client-typing-indicator" id="clientChatTyping" hidden><i></i><i></i><i></i><span>El administrador está escribiendo</span></div>
          <div class="assistant-suggestions" id="assistantSuggestions"></div>
          <form class="assistant-form" id="assistantForm">
            <input id="assistantInput" name="message" type="text" autocomplete="off" placeholder="Ej: Quiero una canasta de cerveza">
            <button class="primary" type="submit" aria-label="Enviar mensaje"><i data-lucide="send"></i></button>
          </form>
        </div>
      </section>

      <section class="client-section" id="billChat" hidden></section>
    </main>

    <script src="vendor/lucide.min.js"></script>
    <script src="app.js?v=20260920-offline-shared-refresh-zones-1"></script>
  </body>
</html>
