name: Regresiones de rendimiento del POS

on:
  push:
    branches: [main]
    paths: ['app.js', 'style.css', 'admin.html', 'service-worker.js', 'vendor/**', 'tests/**', '.github/workflows/performance-regression.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Comprobar limites, indices y reutilizacion durante jornadas largas
        run: node --test tests/navigation-performance.test.cjs tests/long-session-reports.test.cjs tests/long-shift-sync-performance.test.cjs tests/offline-confirmation-cleanup-performance.test.cjs
      - name: Preparar navegador de prueba
        run: |
          npm install --prefix "$RUNNER_TEMP/pos-performance" --no-save --no-audit --no-fund playwright-core@1.65.1
          echo "NODE_PATH=$RUNNER_TEMP/pos-performance/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pos-performance/node_modules/.bin/playwright-core" install --with-deps chromium
      - name: Seleccionar Chromium
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'CHROME_PATH=' + require('playwright-core').chromium.executablePath() + '\n')"
      - name: Verificar navegacion, compras y lectura rapida de codigos con carga
        run: node --test --test-concurrency=1 --test-timeout=120000 tests/navigation-load-browser.test.cjs tests/long-session-purchases-browser.test.cjs tests/individual-barcode-browser.test.cjs
